<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buy Service - TeleSupport Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">TeleSupport Hub</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="/buy-service">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="/my-purchases">My Purchases</a></li>
            <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-stack">
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} flash-toast" role="alert">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card glass-card" data-aos="fade-up">
            <div class="card-body">
              <h1 class="h4 mb-4">Buy Telecom Service</h1>
              <form method="post" action="/buy-service">
                <div class="mb-4">
                  <label class="form-label" for="service_name">Select Service</label>
                  <select class="form-select" id="service_name" name="service_name" required>
                    <option value="Broadband 100 Mbps">Broadband 100 Mbps</option>
                    <option value="Fiber 200 Mbps">Fiber 200 Mbps</option>
                    <option value="Postpaid Plan ₹499">Postpaid Plan ₹499</option>
                    <option value="Postpaid Plan ₹799">Postpaid Plan ₹799</option>
                    <option value="Unlimited Calling Pack">Unlimited Calling Pack</option>
                  </select>
                </div>
                <div class="d-flex justify-content-between">
                  <a class="btn btn-outline-secondary" href="/dashboard">Back to Dashboard</a>
                  <button class="btn btn-primary" type="submit">Purchase Service</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 900,
        once: true,
      });
      document.querySelectorAll('.flash-toast').forEach((toast) => {
        setTimeout(() => {
          toast.classList.add('hide');
          setTimeout(() => toast.remove(), 400);
        }, 3000);
      });
    </script>
  </body>
</html>
